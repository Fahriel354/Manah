<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Clash</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="rotate-warning">
        <div class="rotate-icon">🔄</div>
        <p>MOHON PUTAR HP KAMU KESISI LANDSCAPE (MENDATAR)</p>
    </div>

    <div id="game-container">
        <!-- CANVAS UTAMA TEMPAT GAME DIGAMBAR -->
        <canvas id="gameCanvas" width="900" height="500"></canvas>

        <!-- MENU UTAMA (MUNCUL SEBELUM GAME MULAI) -->
        <div id="main-menu" class="ui-overlay">
            <h1>PIXEL CLASH</h1>
            <div class="btn-group">
                <button id="btn-vs-cpu">VS CPU</button>
                <button id="btn-vs-player">VS PLAYER (2P)</button>
            </div>
        </div>

        <!-- MENU GAME OVER (MUNCUL SAAT ADA YANG KALAH) -->
        <div id="game-over-menu" class="ui-overlay hidden">
            <h1 id="winner-title">MENANG!</h1>
            <div class="btn-group">
                <button id="btn-restart">MAIN LAGI</button>
                <button id="btn-menu">MENU UTAMA</button>
            </div>
        </div>

    </div>

    <!-- KOTAK DEBUG: menampilkan error JS langsung di layar HP -->
    <div id="debug-box" style="
        display:none;
        position:fixed;
        bottom:0; left:0;
        width:100%;
        max-height:40%;
        overflow:auto;
        background:rgba(200,0,0,0.95);
        color:#fff;
        font-family:monospace;
        font-size:12px;
        padding:10px;
        z-index:9999;
        white-space:pre-wrap;
        word-break:break-word;
    "></div>

    <script>
        window.addEventListener('error', function(e) {
            const box = document.getElementById('debug-box');
            box.style.display = 'block';
            box.textContent += '❌ ERROR: ' + e.message + '\n(baris ' + e.lineno + ', file ' + (e.filename ? e.filename.split('/').pop() : '?') + ')\n\n';
        });
    </script>

    <script src="script.js"></script>
</body>
</html>

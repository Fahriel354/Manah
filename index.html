<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Clash</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="rotate-warning">
        <div class="rotate-icon">🔄</div>
        <p>MOHON PUTAR HP KAMU KESISI LANDSCAPE (MENDATAR)</p>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="900" height="500"></canvas>
        
        <!-- Menu Utama -->
        <div id="main-menu" class="ui-overlay">
            <h1>PIXEL CLASH</h1>
            <p>🏹 Pemanah vs 🔫 Penembak Arena</p>
            <div class="btn-group">
                <button id="btn-vs-cpu" type="button">Main Soliter (vs CPU)</button>
                <button id="btn-vs-player" type="button">Main Berdua (2P)</button>
            </div>
        </div>

        <!-- Menu Game Over -->
        <div id="game-over-menu" class="ui-overlay hidden">
            <h1 id="winner-title">Pemain 1 Menang!</h1>
            <div class="btn-group">
                <button id="btn-restart" type="button">Main Lagi</button>
                <button id="btn-menu" type="button">Menu Utama</button>
            </div>
        </div>

        <!-- OVERLAY KONTROL LAYAR SENTUH -->
        <div id="touch-controls" class="touch-overlay">
            
            <!-- === KONTROL P1 (SELALU MUNCUL) === -->
            <div id="p1-touch" class="p-controls">
                <div class="dpad">
                    <button id="t-left" class="t-btn">◄</button>
                    <button id="t-right" class="t-btn">►</button>
                    <button id="t-up" class="t-btn jump-btn">▲</button>
                </div>
                <div class="actions">
                    <button id="t-shoot" class="t-btn action-btn">🏹</button>
                    <button id="t-super" class="t-btn super-btn">⚡ SUPER</button>
                </div>
            </div>

            <!-- === KONTROL P2 (HANYA MUNCUL SAAT MAIN BERDUA) === -->
            <div id="p2-touch" class="p-controls p2-layout hidden">
                <div class="actions">
                    <button id="t2-shoot" class="t-btn action-btn p2-theme">🔫</button>
                    <button id="t2-super" class="t-btn super-btn p2-theme">⚡ SUPER</button>
                </div>
                <div class="dpad">
                    <button id="t2-left" class="t-btn p2-theme">◄</button>
                    <button id="t2-right" class="t-btn p2-theme">►</button>
                    <button id="t2-up" class="t-btn jump-btn p2-theme">▲</button>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
